[project]
name = "sdd-harness"
version = "0.1.0"
description = "Engines behind the intake, route and refine skills: LangGraph graphs, hybrid RAG with provenance, and decision traces for Spec-Driven Development."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=2.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
voyage = ["voyageai>=0.3"]

[project.scripts]
sdd-intake = "sdd_harness.intake.cli:main"
sdd-route = "sdd_harness.router.cli:main"
sdd-refine = "sdd_harness.ledger.cli:main"
sdd-index = "sdd_harness.rag.cli:main"
sdd-jev = "sdd_harness.jev.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The row catalog is a data table; wrapping its option strings hurts readability.
"src/sdd_harness/intake/rows.py" = ["E501"]
